[package]
name = "gridfpv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `live` pulls the dockerized-RotorHazard e2e harness (the testkit container + the
# engine's heat loop) into the server's *dev*-builds so `tests/full_event_live.rs` can
# drive a real event over real RH into the protocol server's log and observe it through a
# protocol client (HTTP snapshot + WS change-stream). It mirrors the engine's `live`
# feature: off by default so the core server stays Docker-free, and the e2e test is also
# `#[ignore]` so it never runs in the shared CI suite — only in the dedicated `rh-live`
# job (`cargo test -p gridfpv-server --features live --test full_event_live -- --ignored`).
#
# It enables only dev-dependencies (the test harness), so it adds nothing to the shipped
# library. `gridfpv-engine/live` pulls the adapters' Socket.IO transport the harness drives.
live = ["dep:gridfpv-testkit", "dep:gridfpv-adapters", "gridfpv-adapters/live", "gridfpv-engine/live"]

[dependencies]
gridfpv-events.workspace = true
gridfpv-projection.workspace = true
gridfpv-engine.workspace = true
gridfpv-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = "12"

# The snapshot HTTP transport (#42) and the WS change stream (#43) build on the same
# axum `Router` and `AppState` defined in `app.rs`; the control path (#45) reuses
# `AppState::append`. `ws` enables axum's WebSocket upgrade extractor.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "net"] }

# The smart SPA-or-typed-404 fallback (#64) drives an inner SPA `Service` (the Director's
# `ServeDir`) by hand, so it needs `tower`'s `Service`/`ServiceExt` in the *library* (not
# just dev-builds) — hence a regular dependency. `util` brings `ServiceExt::ready`.
tower = { version = "0.5", features = ["util"] }

# Auth (#44): opaque bearer + read-only join tokens are random, unguessable strings.
# `getrandom` draws them straight from the OS CSPRNG — minimal, std-ish, no key
# management. Real signed/HMAC join tokens are a later concern (see `auth` module docs).
getrandom = "0.3"

# The mock-RH e2e harness (#47), enabled only by the `live` feature. Optional so the
# default server build pulls no Docker/Socket.IO machinery; the `full_event_live` test
# drives it to stand up a real RotorHazard and feed a real event into the server's log.
# (A regular — not dev — dependency because cargo features can only gate `[dependencies]`
# via `dep:`; it is dead weight unless `live` is on, exactly like the engine's testkit dep.)
gridfpv-testkit = { workspace = true, optional = true }
# The RotorHazard transport (#47, `live` only): the e2e drives the dockerized RH the same
# way the engine's harness does — connect, reset, stage, drain the timer's real passes.
gridfpv-adapters = { workspace = true, optional = true }

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the snapshot router in integration tests with no
# real network or Docker; `http-body-util` collects the response body to assert on it.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The WS change-stream integration tests (#43) spin the router on an ephemeral localhost
# port via `axum::serve` and connect with a real WebSocket client (no Docker).
tokio-tungstenite = "0.24"
futures-util = "0.3"
