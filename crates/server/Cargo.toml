[package]
name = "gridfpv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
gridfpv-events.workspace = true
gridfpv-storage.workspace = true
gridfpv-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = "12"
thiserror = "2"

# The HTTP API is one axum `Router` (see `app.rs`).
axum = "0.8"

# The smart SPA-or-typed-404 fallback (#64) drives an inner SPA `Service` (the Director's
# `ServeDir`) by hand, so it needs `tower`'s `Service`/`ServiceExt` in the *library* (not
# just dev-builds) — hence a regular dependency. `util` brings `ServiceExt::ready`.
tower = { version = "0.5", features = ["util"] }

# Auth (#44): opaque bearer + read-only join tokens are random, unguessable strings.
# `getrandom` draws them straight from the OS CSPRNG — minimal, std-ish, no key
# management. Real signed/HMAC join tokens are a later concern (see `auth` module docs).
getrandom = "0.3"

# The change feed (`GET /events/{id}/changes`): a `watch` channel per event carries the log
# cursor, and the feed is a server-sent-event stream built with `futures-util`.
tokio = { version = "1", features = ["sync", "time"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the router in tests with no real network;
# `http-body-util` collects the response body to assert on it.
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
