[package]
name = "gridfpv-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `live` pulls the real network transport (a Socket.IO client). Off by default so
# the core translator crate stays dependency-light; the live integration test
# (`tests/rh_live.rs`, against dockerized RotorHazard) enables it.
live = ["dep:rust_socketio"]

[dependencies]
gridfpv-events.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_socketio = { version = "0.6", optional = true }

[dev-dependencies]
gridfpv-projection.workspace = true
