[package]
name = "gridfpv-serverd"
description = "The Grid remote server: holds the events Directors push to it (docs/primitives.md §13)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The program is `gridfpv-server`. The package is not called that because `gridfpv-server`
# is already the library with the Director's HTTP API, which this one is built on.
[[bin]]
name = "gridfpv-server"
path = "src/main.rs"

[features]
# Take the built console into the program, so it is one file with nothing beside it. The
# frontend must be built first (`npm run build` in `frontend/`).
embed-page = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
gridfpv-events.workspace = true
gridfpv-storage.workspace = true
gridfpv-engine.workspace = true
gridfpv-server.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
# The web page is the built console, served as files.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
# Accounts, sessions, invites and roles are kept in one SQLite file (`accounts.rs`). The
# same build of SQLite the event logs use.
rusqlite = { version = "0.41", features = ["bundled"] }
# The shapes the server's page reads are generated to TypeScript, as the Director's are.
ts-rs = "12"
# Link tokens are random and kept only as a hash.
# The change feed a page follows an event by.
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# The read tests run a whole Director, push its event here, and compare what each shows.
gridfpv-app = { path = "../app" }
tempfile = "3"
http-body-util = "0.1"
