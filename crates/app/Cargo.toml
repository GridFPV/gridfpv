[package]
name = "gridfpv-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gridfpv"
path = "src/main.rs"

[features]
# `live` compiles in the **real RotorHazard adapter** (the feature-gated Socket.IO transport)
# so a selected `Rotorhazard { url }` timer actually connects and feeds its passes into the
# event log (#65, #73). It pulls `gridfpv-adapters/live`, which pulls a TLS stack
# (native-tls, OpenSSL-vendored on Linux).
#
# `live` is a **DEFAULT feature**: the product's whole job is talking to real timers, and a
# default-off transport shipped a Director that could never leave "Configured" — it silently
# neutered both a dev deploy (2026-07-03, a lost test session) and the desktop release
# artifact (src-tauri depends on gridfpv-app without naming `live`). The openssl-vendored
# compile is a cache-warm one-time cost; correctness of the shipped binary wins. A slim,
# OpenSSL-free Mock/sim-only build remains available with `--no-default-features`.
default = ["live"]
live = ["dep:gridfpv-adapters", "gridfpv-adapters/live"]

# `embed-assets` bakes the built RD console SPA (`frontend/apps/rd-console/dist`) **into the
# binary** at compile time (via `rust-embed`), so the Director serves the frontend from memory
# with **no external assets folder** beside the executable. This is how the native desktop
# (`gridfpv-desktop`) build becomes a single self-contained file.
#
# It is **OFF by default**: the team's hosted dev loop
# (`cargo build -p gridfpv-app --features live`, then serve a `GRIDFPV_ASSETS` dist from disk)
# must keep working byte-for-byte — rebuild the dist without rebuilding the binary — so the
# default build serves from the filesystem exactly as before and `cargo xtask ci` (default
# features) never needs a built dist at compile time. The dist must exist at compile time
# ONLY when this feature is enabled (the Tauri / release-builds workflow builds the frontend
# first, so that holds).
embed-assets = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
gridfpv-events.workspace = true
gridfpv-storage.workspace = true
gridfpv-projection.workspace = true
# The race engine: the runtime clock (heat-lifecycle Slice 2) reads the heat FSM vocabulary
# (`GraceWindow`) and the pure win-condition completion predicate (`scoring::race_end_reached`) to
# drive the auto start/completion transitions. Pure Rust — no network/TLS, so the default Director
# build stays openssl-free.
gridfpv-engine.workspace = true
# Only compiled in under `--features live` (the real RotorHazard adapter + its TLS stack); the
# default build never pulls it (and so never pulls openssl). Also a dev-dependency below for the
# default-feature tests that use the pure translator without the live transport.
gridfpv-adapters = { workspace = true, optional = true }

# The Director server: `main.rs` opens the log, builds `server::router(state)`, and
# serves the protocol API + the built RD console SPA over axum. `tokio` runs the async
# runtime; `tower-http` adds `ServeDir` (SPA fallback) + permissive CORS (so the Windows
# Tauri app, a different origin, can call the API/WS). axum matches the server's 0.8.
# NO adapters / `live` feature here — server + storage + axum + tower-http + tokio only,
# so the Director binary never pulls openssl.
gridfpv-server.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Only compiled in under `--features embed-assets`: `rust-embed` bakes the built RD console
# `dist/` into the binary at compile time, and `mime_guess` resolves each embedded file's
# Content-Type by extension. The default build pulls neither — it serves from the filesystem
# via `tower-http`'s `ServeDir` exactly as before, so the hosted dev loop is unchanged.
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
serde_json.workspace = true
gridfpv-adapters.workspace = true
# `gridfpv-engine` is a regular dependency above (the runtime clock uses it), which covers the
# tests too — so no dev-dependency entry is needed.
# The dockerized-RotorHazard harness for the `live` Director RH-connect e2e
# (`tests/rh_connect_live.rs`): spins up + tears down a disposable RH container.
gridfpv-testkit.workspace = true
# The Director integration test (#13) drives the served router with no real network via
# `tower::ServiceExt::oneshot`, collecting the response body to assert on it.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
