name: Release builds

# Gated, cost-aware native-app build pipeline — produces the Tauri desktop
# PORTABLE binary (the RELEASE form of GridFPV; see src-tauri/README.md). This is
# a PORTABLE-ONLY build: it builds with `--no-bundle`, so no installers
# (msi/nsis/appimage/deb) are produced — just the self-contained
# gridfpv-desktop[.exe] with the embedded frontend. This is
# DELIBERATELY NOT part of the per-push CI (ci.yml): it does NOT run on devel,
# on pull_request, or on every push, so dev velocity and Actions cost are
# preserved. It only runs:
#   - manually (workflow_dispatch — the "Run workflow" button / `gh workflow run`)
#   - on merge to main (release builds)
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} — Tauri portable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Single-file portable: the raw self-contained gridfpv-desktop binary
            # (frontend embedded via the embed-assets feature — no external dist).
            portable-artifact: gridfpv-linux-portable
            portable-path: src-tauri/target/release/gridfpv-desktop
          - os: windows-latest
            portable-artifact: gridfpv-windows-portable
            portable-path: src-tauri/target/release/gridfpv-desktop.exe
          - os: macos-latest
            # Apple Silicon (macos-latest = arm64) — covers every modern Mac; an Intel
            # (x86_64) leg is a matrix add if one ever turns up at the field.
            portable-artifact: gridfpv-macos-portable
            portable-path: src-tauri/target/release/gridfpv-desktop

    steps:
      # fetch-tags is load-bearing for the build stamp (#513): a build names itself by its
      # release version only when HEAD sits exactly on a clean v* tag, so the tags must be
      # present in the checkout. Dispatch this workflow FROM the tagged commit to produce a
      # release-named build; a dispatch from an untagged commit correctly produces the
      # 0.4.0-dev-<short hash> naming (the dev-* prerelease portables).
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # Linux-only: Tauri's webkit2gtk/GTK system deps (Windows uses the bundled
      # WebView2 runtime and needs none of these). Mirror src-tauri/README.md.
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      # Cache keyed per-OS; src-tauri is a standalone workspace, so point the
      # cache at its own lockfile so the matrix legs don't collide.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the frontend (the workspace packages + the rd-console dist that the
      # app bundles). This is exactly what tauri.conf.json's beforeBuildCommand
      # runs (`cd frontend && npm ci && npm run build`); doing it explicitly here
      # makes the dist build a visible, cached step and matches ci.yml's
      # conventions (npm ci + npm run build under frontend/).
      - name: Build frontend (rd-console dist)
        run: |
          npm ci
          npm run build
        working-directory: frontend

      # The build stamp (#513) reads `git status --porcelain` at compile time, so a build step
      # that mutates the tree stamps the portable `-dirty`. Print the tree state before and
      # after the build so a dirty stamp is diagnosable FROM THIS LOG instead of by archaeology
      # (the first stamped run re-locked a stale src-tauri/Cargo.lock — #515; a Windows leg
      # stayed dirty after that fix, which is what this step exists to name).
      - name: Tree state before the build (the stamp reads this)
        shell: bash
        run: git status --porcelain

      # PORTABLE-ONLY build: `--no-bundle` compiles the gridfpv-desktop crate (with
      # the embedded frontend + the Windows icon) into
      # src-tauri/target/release/gridfpv-desktop[.exe] but produces NO installers
      # (msi/nsis/appimage/deb) — bundle.targets in tauri.conf.json is irrelevant
      # because --no-bundle skips bundling entirely. It re-runs beforeBuildCommand
      # (idempotent — frontend already built above).
      - name: Build Tauri portable binary (--no-bundle)
        run: npx -y @tauri-apps/cli@2 build --no-bundle
        working-directory: src-tauri

      # Single-file portable: the raw gridfpv-desktop binary. Because gridfpv-app is
      # built with the embed-assets feature, the frontend dist is baked into the
      # binary, so it self-serves the RD console with no external assets folder — a
      # standalone executable. This is the ONLY release artifact (portable-only).
      # Does the thing we are about to ship actually START? The build proves it compiles and
      # bundles; it does not prove it runs. That gap is the whole of #58's "done when the single
      # binary launches on all three OSes" — and the maintainer has no Mac to check it on, so
      # without this the macOS leg ships entirely unverified.
      #
      # The check is deliberately narrow and honest about it: the app must get past Tauri's setup,
      # spawn its embedded Director, write its startup line, and still be alive a few seconds later.
      # That catches a missing runtime library, a panic in setup, an embedded-asset failure, or an
      # immediate exit. It does NOT prove the window renders or the console is usable — a human
      # still has to click it once per platform.
      # The after-shot of the tree-state pair above: whatever appears here and not there is
      # what the BUILD wrote into the tracked tree — the exact set the stamp saw (build scripts
      # run early in the compile, so strictly the stamp may have seen a prefix of it).
      - name: Tree state after the build (what the build dirtied)
        shell: bash
        run: git status --porcelain

      - name: Smoke-test the portable binary (does it start?)
        shell: bash
        env:
          BIN: ${{ matrix.portable-path }}
        run: |
          set -uo pipefail
          LOGDIR="$(mktemp -d)"
          export GRIDFPV_LOG_DIR="$LOGDIR"
          # Linux CI has no display; Tauri needs one to create its window. xvfb is the standard
          # answer. Windows and macOS runners already have a session.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "$BIN" & APP=$!
          else
            "$BIN" & APP=$!
          fi

          # Give it room to boot: Tauri setup, the Director binding its ephemeral loopback port,
          # and the first window paint.
          for _ in $(seq 1 20); do
            sleep 1
            kill -0 "$APP" 2>/dev/null || break
            grep -rqs "starting" "$LOGDIR" && break
          done

          if ! kill -0 "$APP" 2>/dev/null; then
            echo "::error::gridfpv-desktop exited on startup — it does not launch on $RUNNER_OS"
            echo "--- log ---"; cat "$LOGDIR"/* 2>/dev/null || echo "(no log written at all)"
            exit 1
          fi
          if ! grep -rqs "starting" "$LOGDIR"; then
            echo "::error::gridfpv-desktop is running but never wrote its startup line — it did not get past setup"
            cat "$LOGDIR"/* 2>/dev/null || echo "(no log written at all)"
            kill "$APP" 2>/dev/null || true
            exit 1
          fi

          echo "started cleanly on $RUNNER_OS:"
          grep -rhs "starting" "$LOGDIR" | head -1
          kill "$APP" 2>/dev/null || true
          wait "$APP" 2>/dev/null || true

      - name: Upload portable binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.portable-artifact }}
          path: ${{ matrix.portable-path }}
          if-no-files-found: error
