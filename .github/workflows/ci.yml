name: CI

# Core, deterministic checks — the same suite local dev runs, now including the
# frontend + contract suite (which the GitLab pipeline never ran). The heavier
# browser e2e and the dockerized-RotorHazard live suite are gated separately
# (see heavy.yml) per the runner-cost policy.
on:
  push:
    branches: [main, devel, "milestone/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fmt --check && clippy -D warnings && test --all && ts-rs bindings drift-check
      - run: cargo xtask ci

  audit:
    name: Security — cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cache the cargo-audit binary (and the advisory-db it fetches) so the job
      # stays fast — it only reads Cargo.lock, it never builds the workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-audit lives in ~/.cargo/bin and the advisory-db under
          # ~/.cargo/advisory-db; key the cache so a fresh install is rare.
          cache-bin: true
          shared-key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Triaged/accepted advisories are enumerated in ./audit.toml; this fails
      # the job on any new advisory (including real vulnerabilities).
      - run: cargo audit

  frontend:
    name: Frontend — build/check/lint/test/contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Type-check
        run: npm run check
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      # The contract suite boots the real Director, so build it first.
      - name: Build Director
        run: cargo build -p gridfpv-app
      - name: Contract suite (strict client↔server wire checks)
        run: npm run contract
        working-directory: frontend

  e2e:
    # The browser click-through against a REAL Director. Split from the job above because it needs
    # Chromium's system libraries, and kept in CI rather than release-gated because the bugs it
    # catches — routing, screen lifecycle, subscription teardown across navigation — are shell-level
    # and have historically reached real hardware before anyone noticed. The dockerized-RotorHazard
    # live matrix stays separate; that one genuinely needs containers and minutes.
    #
    # Locally the same specs run via `cargo xtask e2e`, which borrows Microsoft's Playwright image
    # so a build box needs no system packages. Same specs, same config, both places.
    name: Frontend — browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: frontend
      # The runner CAN install system packages, so no container is needed here.
      - name: Install Chromium + its system deps
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Each worker boots the real binary; the harness would build it on demand, but doing it here
      # keeps a compile failure out of the middle of a spec.
      - name: Build Director
        run: cargo build -p gridfpv-app
      - name: e2e
        run: npm run e2e
        working-directory: frontend
      # Traces are retained on failure only (playwright.config.ts) — the thing you actually want
      # when a click-through fails on a machine you cannot see.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
