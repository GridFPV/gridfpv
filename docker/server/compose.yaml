# The Grid remote server behind Caddy, which gets and renews an HTTPS certificate by itself.
#
#   1. Point a domain name at this computer, and let ports 80 and 443 in.
#   2. Put the name in a file called `.env` beside this one:   GRID_DOMAIN=grid.example.org
#   3. docker compose up -d
#   4. docker compose exec server gridfpv-server token new "my laptop"
#
# The full steps, and what to do with no domain name, are in docs/server-setup.md.

services:
  server:
    build:
      context: ../..
      dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    environment:
      GRIDFPV_SERVER_PUBLIC_URL: https://${GRID_DOMAIN}
      # Sign-in. Put these in .env to switch a provider on (docs/server-setup.md).
      GRIDFPV_SERVER_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      GRIDFPV_SERVER_DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GRIDFPV_SERVER_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GRIDFPV_SERVER_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - grid-data:/data
    # Not published: only Caddy reaches it.
    expose:
      - "8470"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRID_DOMAIN: ${GRID_DOMAIN:?Set GRID_DOMAIN in .env to the name people will open, such as grid.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  grid-data:
  caddy-data:
  caddy-config:
